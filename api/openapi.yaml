openapi: 3.1.0
info:
  title: Pet Care ERP API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /owners:
    get:
      summary: List owners
      responses:
        '200':
          description: OK
    post:
      summary: Create owner
      requestBody:
        required: true
      responses:
        '201':
          description: Created
  /consultations:
    post:
      summary: Create consultation
      responses:
        '201':
          description: Created
  /pharmacy/issues:
    post:
      summary: Dispense prescription
      responses:
        '201':
          description: Dispensed
  /admissions/{id}/discharge:
    post:
      summary: Discharge admitted pet
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Discharged
  /invoices/{id}/payments:
    post:
      summary: Record invoice payment
      responses:
        '200':
          description: Payment recorded
