version: '3.9'
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/frontend:ro
    depends_on:
      - app
  app:
    image: php:8.3-fpm-alpine
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - redis
  queue:
    image: php:8.3-cli-alpine
    working_dir: /var/www/html
    command: sh -lc "php artisan queue:work --tries=3"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app
      - redis
  scheduler:
    image: php:8.3-cli-alpine
    working_dir: /var/www/html
    command: sh -lc "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pet_care_erp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: petcare
      MYSQL_PASSWORD: petcare
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

volumes:
  db_data:
